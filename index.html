
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Дашборд сотрудников</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4c28a;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(61, 56, 20, 0.15);
            text-align: center;
            border: 2px solid #d4a271;
        }
        .header h1 {
            font-size: 2.5em;
            color: #3d3814;
        }
        .header p {
            color: #4b4230;
            font-size: 1.1em;
            margin-top: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(61, 56, 20, 0.1);
            transition: transform 0.3s;
            border: 1px solid #d4a271;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #a47a58;
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #3d3814;
        }
        .stat-label {
            color: #4b4230;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(61, 56, 20, 0.1);
            border: 1px solid #d4a271;
            transition: border-color 0.3s;
        }
        .chart-card:hover {
            border-color: #a47a58;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
