name: Update Dashboard Daily

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl plotly

      - name: Run dashboard generator
        run: |
          python dashboard_generator.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.xlsx index.html
          git diff --staged --quiet || git commit -m "Автоматическое обновление данных и дашборда $(date +'%Y-%m-%d')"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/shJurij/my-dashboard.git
